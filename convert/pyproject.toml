[project]
name = "extract-text"
version = "0.1.0"
description = "Extract text from PDF, EPUB, and MOBI files"
authors = [
    {name = "Veto"}
]
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "mobi>=0.3.0",
]

[project.scripts]
extract-text = "extract_text:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
