services:
  phoenix:
    container_name: books_phoenix
    image: myridia/phoenix
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ../../app:/app
      - ./init.sh:/init.sh
      - _build:/app/_build
    command: ["sh", "/init.sh"]
    ports:
      - "4000:4000"
    environment:
      - MIX_ENV=dev
      - DATABASE_URL=ecto://root:${MYSQL_ROOT_PASSWORD:-BooksDev2026}@mysql:3306/books_dev
      - PHX_HOST=localhost
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-BooksDev2026}
    tty: true
    stdin_open: true

  mysql:
    image: mysql:8.0
    container_name: books_mysql
    restart: always
    #ports:
    #  - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./etc/init-sql/setup.sql:/docker-entrypoint-initdb.d/setup.sql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-BooksDev2026}
      - MYSQL_DATABASE=books_dev
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-BooksDev2026}"]
      interval: 5s
      timeout: 3s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: books_phpmyadmin
    depends_on:
      - mysql
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-BooksDev2026}
      UPLOAD_LIMIT: 100M

volumes:
  _build:
  mysql_data:
